<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">AYDO Works — Listen. Build. Hand over.</title>
  <desc id="desc">A dark plum workspace banner with a four-stage path: brief, build, review, handover.</desc>
  <defs>
