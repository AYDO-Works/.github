    <text x="55" y="141" font-size="51" font-weight="650" letter-spacing="-1.8" fill="#f5edf3">Listen. Build.</text>
    <text x="55" y="199" font-size="51" font-weight="650" letter-spacing="-1.8" fill="#d49ac8">Hand over.</text>
    <text x="58" y="252" font-size="16" fill="#bfaabb">Freelance web applications and sites, built to each client's brief.</text>
